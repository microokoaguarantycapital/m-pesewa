<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#2B1D4F" opacity="0.95"/>
  
  <!-- Outer decorative ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#FFC107" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Main group silhouette -->
  <g transform="translate(200, 200)">
    
    <!-- Central person (larger) -->
    <g transform="translate(0, -20)">
      <!-- Head -->
      <circle cx="0" cy="-40" r="25" fill="#FFC107"/>
      
      <!-- Body -->
      <path d="M-20,0 Q0,40 20,0" fill="none" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Arms -->
      <g stroke="#FFC107" stroke-width="6" stroke-linecap="round">
        <line x1="-15" y1="-15" x2="-45" y2="10"/>
        <line x1="15" y1="-15" x2="45" y2="10"/>
      </g>
    </g>
    
    <!-- Left person -->
    <g transform="translate(-70, 20) scale(0.8)">
      <!-- Head -->
      <circle cx="0" cy="-40" r="18" fill="#FFC107" opacity="0.9"/>
      
      <!-- Body -->
      <path d="M-15,0 Q0,30 15,0" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Arms -->
      <g stroke="#FFC107" stroke-width="4" stroke-linecap="round" opacity="0.9">
        <line x1="-12" y1="-10" x2="-35" y2="8"/>
        <line x1="12" y1="-10" x2="35" y2="8"/>
      </g>
    </g>
    
    <!-- Right person -->
    <g transform="translate(70, 20) scale(0.8)">
      <!-- Head -->
      <circle cx="0" cy="-40" r="18" fill="#FFC107" opacity="0.9"/>
      
      <!-- Body -->
      <path d="M-15,0 Q0,30 15,0" fill="none" stroke="#FFC107" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      
      <!-- Arms -->
      <g stroke="#FFC107" stroke-width="4" stroke-linecap="round" opacity="0.9">
        <line x1="-12" y1="-10" x2="-35" y2="8"/>
        <line x1="12" y1="-10" x2="35" y2="8"/>
      </g>
    </g>
    
    <!-- Bottom person -->
    <g transform="translate(0, 80) scale(0.7)">
      <!-- Head -->
      <circle cx="0" cy="-40" r="15" fill="#FFC107" opacity="0.8"/>
      
      <!-- Body -->
      <path d="M-12,0 Q0,25 12,0" fill="none" stroke="#FFC107" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Arms -->
      <g stroke="#FFC107" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <line x1="-10" y1="-8" x2="-30" y2="5"/>
        <line x1="10" y1="-8" x2="30" y2="5"/>
      </g>
    </g>
    
  </g>
  
  <!-- Connecting lines between people -->
  <g stroke="#FFC107" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="130" y1="220" x2="170" y2="220"/>
    <line x1="200" y1="130" x2="200" y2="170"/>
    <line x1="230" y1="190" x2="270" y2="170"/>
    <line x1="170" y1="190" x2="130" y2="170"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="8" fill="#FFC107" opacity="0.3"/>
  <circle cx="300" cy="100" r="8" fill="#FFC107" opacity="0.3"/>
  <circle cx="100" cy="300" r="8" fill="#FFC107" opacity="0.3"/>
  <circle cx="300" cy="300" r="8" fill="#FFC107" opacity="0.3"/>
  
  <!-- Text label at bottom -->
  <text x="200" y="350" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" 
        fill="#FFC107" text-anchor="middle" opacity="0.8">
    GROUP
  </text>
  
  <!-- Inner decorative ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>
</svg>