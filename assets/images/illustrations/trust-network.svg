<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F5F7FB"/>
  
  <!-- Center Circle -->
  <circle cx="200" cy="150" r="40" fill="#2B1D4F"/>
  <text x="200" y="155" text-anchor="middle" fill="#FFF" font-family="Inter" font-size="16" font-weight="700">Trust</text>
  
  <!-- Network Nodes -->
  <circle cx="100" cy="100" r="25" fill="#FFC107"/>
  <text x="100" y="105" text-anchor="middle" fill="#000" font-family="Inter" font-size="12">👥</text>
  
  <circle cx="300" cy="100" r="25" fill="#10B981"/>
  <text x="300" y="105" text-anchor="middle" fill="#FFF" font-family="Inter" font-size="12">👥</text>
  
  <circle cx="100" cy="200" r="25" fill="#3B82F6"/>
  <text x="100" y="205" text-anchor="middle" fill="#FFF" font-family="Inter" font-size="12">👥</text>
  
  <circle cx="300" cy="200" r="25" fill="#8B5CF6"/>
  <text x="300" y="205" text-anchor="middle" fill="#FFF" font-family="Inter" font-size="12">👥</text>
  
  <!-- Connections -->
  <line x1="200" y1="150" x2="100" y2="100" stroke="#2B1D4F" stroke-width="2"/>
  <line x1="200" y1="150" x2="300" y2="100" stroke="#2B1D4F" stroke-width="2"/>
  <line x1="200" y1="150" x2="100" y2="200" stroke="#2B1D4F" stroke-width="2"/>
  <line x1="200" y1="150" x2="300" y2="200" stroke="#2B1D4F" stroke-width="2"/>
  
  <!-- Interconnections -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="#2B1D4F" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#2B1D4F" stroke-width="1" stroke-dasharray="3,3"/>
</svg>