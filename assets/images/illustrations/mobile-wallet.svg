<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F5F7FB"/>
  
  <!-- Mobile Phone -->
  <rect x="150" y="50" width="100" height="180" rx="12" fill="#FFF" stroke="#2B1D4F" stroke-width="2"/>
  <rect x="160" y="60" width="80" height="100" rx="6" fill="#F5F7FB"/>
  
  <!-- Wallet UI -->
  <rect x="160" y="170" width="80" height="30" rx="4" fill="#FFC107"/>
  <text x="200" y="190" text-anchor="middle" fill="#000" font-family="Inter" font-size="12" font-weight="600">KES 2,500</text>
  
  <rect x="170" y="210" width="60" height="8" rx="4" fill="#10B981"/>
  <text x="200" y="235" text-anchor="middle" fill="#2B1D4F" font-family="Inter" font-size="10">Send Money</text>
  
  <!-- Icons -->
  <circle cx="180" cy="130" r="8" fill="#3B82F6"/>
  <circle cx="200" cy="130" r="8" fill="#10B981"/>
  <circle cx="220" cy="130" r="8" fill="#F59E0B"/>
  
  <!-- Money Transfer -->
  <circle cx="100" cy="150" r="15" fill="#2B1D4F" opacity="0.8"/>
  <text x="100" y="155" text-anchor="middle" fill="#FFF" font-family="Inter" font-size="10">→</text>
  
  <circle cx="300" cy="150" r="15" fill="#FFC107" opacity="0.8"/>
  <text x="300" y="155" text-anchor="middle" fill="#000" font-family="Inter" font-size="10">$</text>
  
  <!-- Connection Line -->
  <path d="M115,150 Q200,100 285,150" stroke="#2B1D4F" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
</svg>