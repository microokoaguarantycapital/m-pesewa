<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .ledger-book {fill: #003366}
            .ledger-page {fill: #ffffff}
            .ledger-line {stroke: #0099ff; stroke-width: 1}
            .ledger-data {fill: #28a745}
            .ledger-binding {fill: #f37021}
        </style>
    </defs>
    
    <!-- Book Cover -->
    <rect x="20" y="20" width="60" height="60" rx="3" class="ledger-book"/>
    
    <!-- Pages -->
    <rect x="25" y="25" width="50" height="50" class="ledger-page"/>
    
    <!-- Binding -->
    <rect x="78" y="20" width="2" height="60" class="ledger-binding"/>
    
    <!-- Ledger Lines -->
    <line x1="30" y1="35" x2="70" y2="35" class="ledger-line"/>
    <line x1="30" y1="45" x2="70" y2="45" class="ledger-line"/>
    <line x1="30" y1="55" x2="70" y2="55" class="ledger-line"/>
    <line x1="30" y1="65" x2="70" y2="65" class="ledger-line"/>
    
    <!-- Data Entries -->
    <!-- Entry 1 -->
    <circle cx="35" cy="35" r="3" class="ledger-data"/>
    <circle cx="50" cy="35" r="3" class="ledger-data"/>
    <circle cx="65" cy="35" r="3" class="ledger-data"/>
    
    <!-- Entry 2 -->
    <circle cx="35" cy="45" r="3" fill="#f37021"/>
    <circle cx="50" cy="45" r="3" fill="#f37021"/>
    <circle cx="65" cy="45" r="3" fill="#f37021"/>
    
    <!-- Entry 3 -->
    <circle cx="35" cy="55" r="3" class="ledger-data"/>
    <circle cx="50" cy="55" r="3" class="ledger-data"/>
    <circle cx="65" cy="55" r="3" class="ledger-data"/>
    
    <!-- Page Corner -->
    <path d="M70,25 L75,20 L75,25 Z" fill="#f8f9fa" stroke="#003366" stroke-width="1"/>
    
    <!-- Active Indicator -->
    <circle cx="85" cy="30" r="4" fill="#28a745">
        <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>