<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .overdue-circle {fill: #dc3545}
            .overdue-inner {fill: #ffffff}
            .overdue-exclamation {fill: #dc3545}
        </style>
    </defs>
    
    <circle cx="50" cy="50" r="40" class="overdue-circle"/>
    <circle cx="50" cy="50" r="30" class="overdue-inner"/>
    
    <!-- Exclamation Mark -->
    <rect x="48" y="30" width="4" height="25" class="overdue-exclamation"/>
    <circle cx="50" cy="65" r="4" class="overdue-exclamation">
        <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Warning Lines -->
    <line x1="30" y1="30" x2="40" y2="40" stroke="#dc3545" stroke-width="3"/>
    <line x1="70" y1="30" x2="60" y2="40" stroke="#dc3545" stroke-width="3"/>
    <line x1="30" y1="70" x2="40" y2="60" stroke="#dc3545" stroke-width="3"/>
    <line x1="70" y1="70" x2="60" y2="60" stroke="#dc3545" stroke-width="3"/>
</svg>