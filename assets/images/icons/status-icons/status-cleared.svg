<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .cleared-circle {fill: #28a745}
            .cleared-check {stroke: #ffffff; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round}
        </style>
    </defs>
    
    <circle cx="50" cy="50" r="40" class="cleared-circle"/>
    
    <!-- Check Mark -->
    <path d="M30,50 L45,65 L70,35" class="cleared-check"/>
    
    <!-- Celebration Dots -->
    <circle cx="30" cy="30" r="3" fill="#ffffff">
        <animate attributeName="cx" values="30;35;30" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="30;25;30" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="70" cy="30" r="3" fill="#ffffff">
        <animate attributeName="cx" values="70;65;70" dur="1s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="cy" values="30;25;30" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    
    <circle cx="30" cy="70" r="3" fill="#ffffff">
        <animate attributeName="cx" values="30;35;30" dur="1s" repeatCount="indefinite" begin="0.4s"/>
        <animate attributeName="cy" values="70;65;70" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    
    <circle cx="70" cy="70" r="3" fill="#ffffff">
        <animate attributeName="cx" values="70;65;70" dur="1s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="cy" values="70;65;70" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
</svg>