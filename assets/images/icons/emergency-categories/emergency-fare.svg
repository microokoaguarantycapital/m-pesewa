<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .bus-body {fill: #003366}
            .bus-window {fill: #0099ff}
            .bus-wheel {fill: #000000}
            .bus-light {fill: #f37021}
        </style>
    </defs>
    
    <!-- Bus Body -->
    <rect x="10" y="30" width="80" height="40" rx="5" class="bus-body"/>
    <rect x="15" y="35" width="20" height="15" rx="2" class="bus-window"/>
    <rect x="40" y="35" width="20" height="15" rx="2" class="bus-window"/>
    <rect x="65" y="35" width="20" height="15" rx="2" class="bus-window"/>
    
    <!-- Wheels -->
    <circle cx="25" cy="75" r="8" class="bus-wheel"/>
    <circle cx="75" cy="75" r="8" class="bus-wheel"/>
    <circle cx="25" cy="75" r="4" fill="#ffffff"/>
    <circle cx="75" cy="75" r="4" fill="#ffffff"/>
    
    <!-- Headlights -->
    <circle cx="90" cy="45" r="3" class="bus-light"/>
    <circle cx="90" cy="55" r="3" class="bus-light"/>
    
    <!-- Route -->
    <path d="M5,85 L95,85" stroke="#28a745" stroke-width="3" stroke-dasharray="5,5"/>
</svg>