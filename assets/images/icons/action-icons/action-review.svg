<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .review-magnify {fill: #0099ff}
            .review-doc {fill: #ffffff}
            .review-doc-border {stroke: #003366; stroke-width: 3; fill: none}
            .review-star {fill: #ffcc00}
            .review-text {fill: #555555}
        </style>
    </defs>
    
    <!-- Magnifying Glass -->
    <circle cx="70" cy="30" r="20" class="review-magnify" fill="none" stroke-width="5"/>
    <line x1="85" y1="45" x2="95" y2="55" stroke="#0099ff" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Document -->
    <rect x="20" y="30" width="40" height="40" rx="3" class="review-doc"/>
    <rect x="20" y="30" width="40" height="40" rx="3" class="review-doc-border"/>
    
    <!-- Document Lines -->
    <rect x="25" y="40" width="30" height="3" class="review-text"/>
    <rect x="25" y="48" width="25" height="3" class="review-text"/>
    <rect x="25" y="56" width="20" height="3" class="review-text"/>
    
    <!-- Stars -->
    <!-- Star 1 -->
    <g transform="translate(30,70)">
        <polygon points="0,-5 2,-2 5,-2 3,0 4,3 0,1 -4,3 -3,0 -5,-2 -2,-2" class="review-star"/>
    </g>
    <!-- Star 2 -->
    <g transform="translate(40,70)">
        <polygon points="0,-5 2,-2 5,-2 3,0 4,3 0,1 -4,3 -3,0 -5,-2 -2,-2" class="review-star"/>
    </g>
    <!-- Star 3 -->
    <g transform="translate(50,70)">
        <polygon points="0,-5 2,-2 5,-2 3,0 4,3 0,1 -4,3 -3,0 -5,-2 -2,-2" class="review-star"/>
    </g>
    <!-- Star 4 -->
    <g transform="translate(60,70)">
        <polygon points="0,-5 2,-2 5,-2 3,0 4,3 0,1 -4,3 -3,0 -5,-2 -2,-2" class="review-star"/>
    </g>
    <!-- Star 5 -->
    <g transform="translate(70,70)">
        <polygon points="0,-5 2,-2 5,-2 3,0 4,3 0,1 -4,3 -3,0 -5,-2 -2,-2" class="review-star"/>
    </g>
    
    <!-- Review Count -->
    <text x="85" y="80" font-family="Arial" font-size="10" font-weight="bold" fill="#003366">5.0</text>
</svg>