<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .transfer-arrow {fill: #0099ff}
            .transfer-coin {fill: #ffcc00}
            .transfer-phone {fill: #003366}
            .transfer-wave {fill: #28a745}
        </style>
    </defs>
    
    <!-- Phone -->
    <rect x="30" y="20" width="40" height="60" rx="8" class="transfer-phone"/>
    <rect x="35" y="25" width="30" height="50" rx="4" fill="#ffffff"/>
    
    <!-- Transfer Arrow -->
    <path d="M20,50 L40,35 L40,45 L80,45 L80,55 L40,55 L40,65 Z" class="transfer-arrow"/>
    
    <!-- Coins -->
    <circle cx="25" cy="75" r="6" class="transfer-coin"/>
    <circle cx="35" cy="70" r="5" class="transfer-coin"/>
    <circle cx="45" cy="75" r="6" class="transfer-coin"/>
    
    <!-- Waves (M-Pesa style) -->
    <g transform="translate(50,40)">
        <path d="M0,0 Q5,-5 10,0 Q15,5 20,0" class="transfer-wave" stroke-width="3" fill="none"/>
        <path d="M0,5 Q5,0 10,5 Q15,10 20,5" class="transfer-wave" stroke-width="3" fill="none" opacity="0.7"/>
        <path d="M0,10 Q5,5 10,10 Q15,15 20,10" class="transfer-wave" stroke-width="3" fill="none" opacity="0.5"/>
    </g>
    
    <!-- Active Indicator -->
    <circle cx="75" cy="75" r="5" fill="#28a745">
        <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>