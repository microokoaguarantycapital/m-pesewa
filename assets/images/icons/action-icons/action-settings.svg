<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .settings-gear-1 {fill: #003366}
            .settings-gear-2 {fill: #0099ff}
            .settings-gear-3 {fill: #f37021}
            .settings-center {fill: #28a745}
        </style>
    </defs>
    
    <!-- Gear 1 (Large) -->
    <g transform="translate(50,50)">
        <circle cx="0" cy="0" r="25" class="settings-gear-1"/>
        <!-- Teeth -->
        <g>
            <rect x="-3" y="-35" width="6" height="15" class="settings-gear-1"/>
            <rect x="-3" y="20" width="6" height="15" class="settings-gear-1"/>
            <rect x="-35" y="-3" width="15" height="6" class="settings-gear-1"/>
            <rect x="20" y="-3" width="15" height="6" class="settings-gear-1"/>
        </g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite"/>
    </g>
    
    <!-- Gear 2 (Medium) -->
    <g transform="translate(30,30)">
        <circle cx="0" cy="0" r="15" class="settings-gear-2"/>
        <!-- Teeth -->
        <g>
            <rect x="-2" y="-22" width="4" height="10" class="settings-gear-2"/>
            <rect x="-2" y="12" width="4" height="10" class="settings-gear-2"/>
            <rect x="-22" y="-2" width="10" height="4" class="settings-gear-2"/>
            <rect x="12" y="-2" width="10" height="4" class="settings-gear-2"/>
        </g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 30 30" to="0 30 30" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <!-- Gear 3 (Small) -->
    <g transform="translate(70,70)">
        <circle cx="0" cy="0" r="10" class="settings-gear-3"/>
        <!-- Teeth -->
        <g>
            <rect x="-2" y="-15" width="4" height="8" class="settings-gear-3"/>
            <rect x="-2" y="7" width="4" height="8" class="settings-gear-3"/>
            <rect x="-15" y="-2" width="8" height="4" class="settings-gear-3"/>
            <rect x="7" y="-2" width="8" height="4" class="settings-gear-3"/>
        </g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 70 70" to="360 70 70" dur="6s" repeatCount="indefinite"/>
    </g>
    
    <!-- Center Dot -->
    <circle cx="50" cy="50" r="8" class="settings-center">
        <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>