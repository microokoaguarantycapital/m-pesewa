<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .nav-card {fill: #003366}
            .nav-chip {fill: #f37021}
            .nav-waves {fill: #0099ff}
            .nav-tier-1 {fill: #28a745}
            .nav-tier-2 {fill: #0099ff}
            .nav-tier-3 {fill: #f37021}
        </style>
    </defs>
    
    <!-- Credit Card -->
    <rect x="20" y="30" width="60" height="40" rx="5" class="nav-card"/>
    
    <!-- Card Chip -->
    <rect x="30" y="40" width="15" height="10" rx="2" class="nav-chip"/>
    
    <!-- Contactless Waves -->
    <g transform="translate(55,40)">
        <path d="M0,5 Q5,0 10,5 Q15,10 20,5" class="nav-waves" stroke-width="3" fill="none"/>
        <path d="M0,8 Q5,3 10,8 Q15,13 20,8" class="nav-waves" stroke-width="3" fill="none" opacity="0.7"/>
    </g>
    
    <!-- Tier Indicators -->
    <!-- Basic Tier -->
    <circle cx="30" cy="70" r="3" class="nav-tier-1"/>
    <!-- Premium Tier -->
    <circle cx="40" cy="70" r="4" class="nav-tier-2"/>
    <!-- Super Tier -->
    <circle cx="50" cy="70" r="5" class="nav-tier-3"/>
    
    <!-- Card Number -->
    <text x="50" y="55" text-anchor="middle" font-family="Arial" font-size="6" fill="#ffffff">•••• •••• ••••</text>
    
    <!-- Shine Effect -->
    <rect x="25" y="35" width="50" height="2" fill="#ffffff" opacity="0.3"/>
</svg>