<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .nav-hand {fill: #f37021}
            .nav-coins {fill: #ffcc00}
            .nav-clock {fill: #003366}
        </style>
    </defs>
    
    <!-- Receiving Hand -->
    <path d="M30,60 Q40,45 50,55 Q60,45 70,60 L60,70 Q50,60 40,70 Z" class="nav-hand"/>
    
    <!-- Coins -->
    <circle cx="40" cy="45" r="6" class="nav-coins">
        <animate attributeName="cy" values="45;50;45" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="40" r="5" class="nav-coins">
        <animate attributeName="cy" values="40;45;40" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="60" cy="45" r="6" class="nav-coins">
        <animate attributeName="cy" values="45;50;45" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    
    <!-- Clock -->
    <circle cx="80" cy="80" r="12" class="nav-clock"/>
    <circle cx="80" cy="80" r="10" fill="#ffffff"/>
    
    <!-- Clock Hands -->
    <line x1="80" y1="80" x2="80" y2="75" stroke="#003366" stroke-width="2"/>
    <line x1="80" y1="80" x2="85" y2="80" stroke="#003366" stroke-width="1">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 80 80" to="360 80 80" dur="12s" repeatCount="indefinite"/>
    </line>
    
    <!-- Days Indicator -->
    <text x="80" y="80" text-anchor="middle" font-family="Arial" font-size="6" fill="#003366">7</text>
</svg>