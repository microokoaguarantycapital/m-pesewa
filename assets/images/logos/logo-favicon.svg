<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <style>
            .favicon-bg {fill: #003366}
            .favicon-m {fill: #ffffff}
            .favicon-p {fill: #f37021}
            .favicon-dot {fill: #28a745}
        </style>
    </defs>
    
    <rect width="32" height="32" rx="6" class="favicon-bg"/>
    
    <!-- M Letter -->
    <path d="M6,22 L10,12 L14,17 L18,12 L22,22" class="favicon-m" stroke-width="2" fill="none"/>
    
    <!-- P Dot -->
    <circle cx="26" cy="18" r="3" class="favicon-p"/>
    
    <!-- Trust Indicator -->
    <circle cx="26" cy="26" r="2" class="favicon-dot">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
</svg>