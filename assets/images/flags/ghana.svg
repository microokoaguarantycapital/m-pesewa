<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <defs>
        <style>
            .ghana-red {fill: #CF0921}
            .ghana-yellow {fill: #FCD20F}
            .ghana-green {fill: #006B3D}
            .ghana-black {fill: #000000}
        </style>
    </defs>
    <rect width="900" height="200" y="0" class="ghana-red"/>
    <rect width="900" height="200" y="200" class="ghana-yellow"/>
    <rect width="900" height="200" y="400" class="ghana-green"/>
    <g transform="translate(450,300)">
        <circle cx="0" cy="0" r="40" class="ghana-black"/>
        <path d="M-30,-50 L30,-50 L0,50 Z" class="ghana-yellow"/>
    </g>
</svg>