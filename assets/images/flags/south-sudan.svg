<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <defs>
        <style>
            .south-sudan-black {fill: #000000}
            .south-sudan-red {fill: #DA121A}
            .south-sudan-green {fill: #078930}
            .south-sudan-blue {fill: #0F47AF}
            .south-sudan-yellow {fill: #FCDD09}
            .south-sudan-white {fill: #FFFFFF}
        </style>
    </defs>
    <rect width="900" height="120" y="0" class="south-sudan-black"/>
    <rect width="900" height="120" y="120" class="south-sudan-red"/>
    <rect width="900" height="120" y="240" class="south-sudan-green"/>
    <rect width="900" height="120" y="360" class="south-sudan-blue"/>
    <rect width="900" height="120" y="480" class="south-sudan-yellow"/>
    <path d="M0,0 L300,300 L0,600 Z" class="south-sudan-blue"/>
    <g transform="translate(150,300)">
        <circle cx="0" cy="0" r="30" class="south-sudan-yellow"/>
        <path d="M-20,-35 L20,-35 L0,35 Z" class="south-sudan-blue"/>
    </g>
</svg>