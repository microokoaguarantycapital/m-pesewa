<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <defs>
        <style>
            .somalia-blue {fill: #4189DD}
            .somalia-white {fill: #FFFFFF}
        </style>
    </defs>
    <rect width="900" height="600" class="somalia-blue"/>
    <g transform="translate(450,300)">
        <circle cx="0" cy="0" r="80" class="somalia-white"/>
        <path d="M-60,-100 L60,-100 L0,100 Z" class="somalia-blue"/>
        <path d="M-60,100 L60,100 L0,-100 Z" class="somalia-blue"/>
        <path d="M-100,-60 L100,60 L-100,60 L100,-60 Z" class="somalia-blue"/>
    </g>
</svg>