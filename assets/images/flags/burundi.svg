<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <defs>
        <style>
            .burundi-white {fill: #FFFFFF}
            .burundi-green {fill: #1EB53A}
            .burundi-red {fill: #CE1126}
        </style>
    </defs>
    <rect width="900" height="600" class="burundi-white"/>
    <path d="M450,0 L900,300 L450,600 L0,300 Z" class="burundi-red"/>
    <path d="M450,60 L840,300 L450,540 L60,300 Z" class="burundi-green"/>
    <path d="M450,120 L780,300 L450,480 L120,300 Z" class="burundi-white"/>
    <g transform="translate(450,300)">
        <circle cx="0" cy="0" r="40" class="burundi-green"/>
        <circle cx="0" cy="0" r="30" class="burundi-white"/>
        <circle cx="0" cy="0" r="20" class="burundi-red"/>
        <path d="M-25,-40 L25,-40 L0,40 Z" class="burundi-white"/>
        <path d="M-25,40 L25,40 L0,-40 Z" class="burundi-white"/>
    </g>
</svg>