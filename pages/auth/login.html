<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - M-Pesewa</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/colors.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link rel="stylesheet" href="../../assets/css/accessibility.css">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" href="../../assets/images/logos/favicon.ico">
    <style>
        :root {
            --primary-blue: #003366;
            --secondary-blue: #0099ff;
            --action-orange: #f37021;
            --trust-green: #28a745;
            --neutral-light: #f8f9fa;
            --pure-white: #ffffff;
            --dark-text: #003366;
            --light-text: #ffffff;
            --body-text: #555555;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #0099ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 400px;
        }
        
        .auth-card {
            background: var(--pure-white);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 51, 102, 0.2);
            border: 1px solid rgba(0, 153, 255, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-logo {
            width: 80px;
            height: 80px;
            background: var(--primary-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--light-text);
            font-size: 32px;
            font-weight: bold;
        }
        
        .auth-title {
            color: var(--dark-text);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            color: var(--body-text);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            color: var(--dark-text);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--pure-white);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(0, 153, 255, 0.1);
        }
        
        .password-toggle {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--body-text);
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        .btn-primary {
            background: var(--primary-blue);
            color: var(--light-text);
        }
        
        .btn-primary:hover {
            background: #002244;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 51, 102, 0.3);
        }
        
        .btn-google {
            background: var(--pure-white);
            color: var(--dark-text);
            border: 2px solid #e1e5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-google:hover {
            border-color: var(--secondary-blue);
            background: var(--neutral-light);
        }
        
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--body-text);
        }
        
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e1e5e9;
        }
        
        .auth-divider span {
            padding: 0 15px;
            font-size: 14px;
        }
        
        .auth-links {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }
        
        .auth-link {
            color: var(--secondary-blue);
            text-decoration: none;
            margin: 0 5px;
        }
        
        .auth-link:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c00;
            display: none;
        }
        
        .success-message {
            background: #efe;
            color: #090;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #090;
            display: none;
        }
        
        .country-selector {
            margin-top: 15px;
        }
        
        .country-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            background: var(--pure-white);
            color: var(--dark-text);
        }
        
        .country-select:focus {
            outline: none;
            border-color: var(--secondary-blue);
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
            
            .auth-logo {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            
            .auth-title {
                font-size: 20px;
            }
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 30px;
            color: var(--light-text);
            font-size: 12px;
            opacity: 0.8;
        }
        
        .auth-footer a {
            color: var(--light-text);
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .role-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .role-btn {
            flex: 1;
            padding: 10px;
            background: var(--neutral-light);
            border: 2px solid transparent;
            border-radius: 6px;
            color: var(--body-text);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .role-btn.active {
            background: var(--primary-blue);
            color: var(--light-text);
            border-color: var(--primary-blue);
        }
        
        .role-btn:hover:not(.active) {
            border-color: var(--secondary-blue);
            color: var(--dark-text);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">M-P</div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Access your M-Pesewa account</p>
            </div>
            
            <div class="role-switch">
                <button class="role-btn active" data-role="borrower">Borrower</button>
                <button class="role-btn" data-role="lender">Lender</button>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username or Email</label>
                    <input type="text" 
                           id="username" 
                           class="form-input" 
                           placeholder="Enter your username or email"
                           required
                           autocomplete="username">
                </div>
                
                <div class="form-group password-toggle">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" 
                           id="password" 
                           class="form-input" 
                           placeholder="Enter your password"
                           required
                           autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="password">Show</button>
                </div>
                
                <div class="form-group country-selector">
                    <label class="form-label" for="country">Country</label>
                    <select id="country" class="country-select" required>
                        <option value="">Select your country</option>
                        <option value="KE">Kenya 🇰🇪</option>
                        <option value="UG">Uganda 🇺🇬</option>
                        <option value="TZ">Tanzania 🇹🇿</option>
                        <option value="RW">Rwanda 🇷🇼</option>
                        <option value="BI">Burundi 🇧🇮</option>
                        <option value="CD">DR Congo 🇨🇩</option>
                        <option value="SS">South Sudan 🇸🇸</option>
                        <option value="ZA">South Africa 🇿🇦</option>
                        <option value="NG">Nigeria 🇳🇬</option>
                        <option value="GH">Ghana 🇬🇭</option>
                        <option value="ET">Ethiopia 🇪🇹</option>
                        <option value="SO">Somalia 🇸🇴</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Login to M-Pesewa</button>
                </div>
            </form>
            
            <div class="auth-divider">
                <span>Or continue with</span>
            </div>
            
            <button type="button" class="btn btn-google" id="googleLogin">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            
            <div class="auth-links">
                <a href="../auth/forgot.html" class="auth-link">Forgot password?</a>
                <span>•</span>
                <a href="../auth/register.html" class="auth-link">Create account</a>
                <span>•</span>
                <a href="../auth/device-verification.html" class="auth-link">Device help</a>
            </div>
        </div>
        
        <div class="auth-footer">
            <p>By logging in, you agree to our <a href="../../pages/global-pages/terms.html">Terms</a> and <a href="../../pages/global-pages/privacy.html">Privacy Policy</a></p>
            <p>© 2016–2026 M-Pesewa Technology Ltd. All rights reserved.</p>
        </div>
    </div>

    <script src="../../modules/auth/auth.service.js"></script>
    <script src="../../modules/auth/auth.guard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle password visibility
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    const type = input.type === 'password' ? 'text' : 'password';
                    input.type = type;
                    this.textContent = type === 'password' ? 'Show' : 'Hide';
                });
            });

            // Role switching
            document.querySelectorAll('.role-btn').forEach(button => {
                button.addEventListener('click', function() {
                    document.querySelectorAll('.role-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    this.classList.add('active');
                    const role = this.getAttribute('data-role');
                    localStorage.setItem('mpesewa_user_role', role);
                });
            });

            // Form submission
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const countrySelect = document.getElementById('country');

            // Check if user already has a country preference
            const savedCountry = localStorage.getItem('mpesewa_country');
            if (savedCountry) {
                countrySelect.value = savedCountry;
            }

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const country = countrySelect.value;
                const role = document.querySelector('.role-btn.active').getAttribute('data-role');

                // Basic validation
                if (!username || !password || !country) {
                    showError('Please fill in all required fields');
                    return;
                }

                if (country.length !== 2) {
                    showError('Please select a valid country');
                    return;
                }

                // Simulate authentication (in production, this would call an API)
                try {
                    // Store user data in localStorage (for demo purposes)
                    localStorage.setItem('mpesewa_country', country);
                    localStorage.setItem('mpesewa_user_role', role);
                    localStorage.setItem('mpesewa_username', username);
                    localStorage.setItem('mpesewa_is_authenticated', 'true');
                    localStorage.setItem('mpesewa_auth_timestamp', Date.now().toString());

                    // Store session data
                    const userData = {
                        id: 'user_' + Date.now(),
                        username: username,
                        role: role,
                        country: country,
                        isVerified: false,
                        requiresVerification: true,
                        createdAt: new Date().toISOString()
                    };
                    localStorage.setItem('mpesewa_user_data', JSON.stringify(userData));

                    showSuccess('Login successful! Redirecting...');

                    // Redirect based on role and verification status
                    setTimeout(() => {
                        if (userData.requiresVerification && !userData.isVerified) {
                            window.location.href = '../auth/verify.html';
                        } else {
                            // Redirect to appropriate dashboard
                            if (role === 'borrower') {
                                window.location.href = '../../pages/borrower/borrower-dashboard.html';
                            } else if (role === 'lender') {
                                window.location.href = '../../pages/lender/lender-dashboard.html';
                            }
                        }
                    }, 1500);

                } catch (error) {
                    showError('Login failed. Please check your credentials and try again.');
                    console.error('Login error:', error);
                }
            });

            // Google login
            document.getElementById('googleLogin').addEventListener('click', function() {
                // In production, this would integrate with Google OAuth
                showSuccess('Google login would redirect to OAuth flow in production');
                
                // Simulate Google login for demo
                setTimeout(() => {
                    localStorage.setItem('mpesewa_auth_provider', 'google');
                    localStorage.setItem('mpesewa_is_authenticated', 'true');
                    localStorage.setItem('mpesewa_requires_verification', 'true');
                    window.location.href = '../auth/device-verification.html';
                }, 1000);
            });

            // Country change handler
            countrySelect.addEventListener('change', function() {
                localStorage.setItem('mpesewa_country', this.value);
            });

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }

            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            }

            // Check if user is already logged in
            if (localStorage.getItem('mpesewa_is_authenticated') === 'true') {
                const authTimestamp = parseInt(localStorage.getItem('mpesewa_auth_timestamp') || '0');
                const hoursSinceLogin = (Date.now() - authTimestamp) / (1000 * 60 * 60);
                
                if (hoursSinceLogin < 24) { // Session valid for 24 hours
                    const userRole = localStorage.getItem('mpesewa_user_role') || 'borrower';
                    if (userRole === 'borrower') {
                        window.location.href = '../../pages/borrower/borrower-dashboard.html';
                    } else if (userRole === 'lender') {
                        window.location.href = '../../pages/lender/lender-dashboard.html';
                    }
                } else {
                    // Session expired
                    localStorage.removeItem('mpesewa_is_authenticated');
                    localStorage.removeItem('mpesewa_auth_timestamp');
                    showError('Your session has expired. Please login again.');
                }
            }
        });
    </script>
</body>
</html>
