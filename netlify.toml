# Netlify Configuration for M-Pesewa Platform
# Deployed from: https://github.com/microokoaguarantycapital/m-pesewa

[build]
  publish = "."  # Publish from root directory
  command = ""   # No build command needed for static site
  functions = "functions/"  # Location for serverless functions if needed

[build.environment]
  NODE_VERSION = "18"  # Node.js version for any Netlify Functions
  PYTHON_VERSION = "3.11"  # Python version for any functions

# ============================================
# REDIRECTS & REWRITES
# ============================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  conditions:
    Language = ["en"]
    Country = ["KE", "UG", "TZ", "RW", "BI", "SS", "SO", "CD", "NG", "GH", "ZA", "ET"]

# Country-specific routing
