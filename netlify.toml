# ============================================
# SECURITY HEADERS
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy for PWA
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
      style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self';
      manifest-src 'self';
      worker-src 'self';
      frame-ancestors 'none';
    """

# Special headers for PWA assets
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/images/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=3600"

# ============================================
# CUSTOM 404 PAGE
# ============================================
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ============================================
# INTERNATIONALIZATION (i18n) SETTINGS
# ============================================
[context.production.environment]
  DEFAULT_COUNTRY = "KE"
  SITE_URL = "https://m-pesewa.netlify.app"
  API_ENDPOINT = "https://api.m-pesewa.com"
  
[context.deploy-preview.environment]
  SITE_URL = "https://deploy-preview-*.m-pesewa.netlify.app"
  API_ENDPOINT = "https://staging-api.m-pesewa.com"
  
[context.branch-deploy.environment]
  SITE_URL = "https://*.m-pesewa.netlify.app"
  API_ENDPOINT = "https://staging-api.m-pesewa.com"

# ============================================
# SERVERLESS FUNCTIONS (if needed in future)
# ============================================
# [functions]
#   node_bundler = "esbuild"

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
[build.environment]
  # PWA Settings
  PWA_NAME = "M-Pesewa"
  PWA_SHORT_NAME = "M-Pesewa"
  PWA_THEME_COLOR = "#003366"
  PWA_BACKGROUND_COLOR = "#ffffff"
  
  # Analytics (if added later)
  GOOGLE_ANALYTICS_ID = ""
  FACEBOOK_PIXEL_ID = ""
  
  # Feature flags
  ENABLE_SERVICE_WORKER = "true"
  ENABLE_OFFLINE_SUPPORT = "true"
  ENABLE_PUSH_NOTIFICATIONS = "false"

# ============================================
# SPAM PROTECTION
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    # Netlify's built-in spam protection headers
    X-Content-Type-Options = "nosniff"
    
    # Custom spam protection
    X-Robots-Tag = "noindex, nofollow"
    X-DNS-Prefetch-Control = "off"

# ============================================
# PERFORMANCE OPTIMIZATIONS
# ============================================
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================
# BROWSER CACHING STRATEGY
# ============================================
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"

# ============================================
# PWA ASSETS
# ============================================
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/images/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================
# PREVIEW DEFAULTS
# ============================================
[context.deploy-preview]
  command = "echo 'Preview build for M-Pesewa'"
  publish = "."

[context.branch-deploy]
  command = "echo 'Branch deploy for M-Pesewa'"
  publish = "."

