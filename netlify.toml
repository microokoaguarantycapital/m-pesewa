# ============================================
# SITE SETTINGS
# ============================================
[site]
  name = "M-Pesewa - Emergency Micro-Lending"
  id = "m-pesewa-platform"
  
  # Git repository settings
  [site.repository]
    provider = "github"
    repo = "microokoaguarantycapital/m-pesewa"
    branch = "main"
    base = "main"
    
  # Domain settings (if custom domain is configured)
  [site.domain]
    name = "m-pesewa.com"
    https = true
    force_ssl = true

# ============================================
# DEPLOY SETTINGS
# ============================================
[deploy]
  # Auto-publish from main branch
  publish = "."
  
  # Skip deploy for certain file changes
  ignore = """
  git diff --quiet HEAD^ HEAD -- README.md
  """
  
  # Deploy hooks (if needed)
  notification_urls = []
  
  # Deploy contexts
  [deploy.contexts]
    production = ["main"]
    staging = ["develop"]
    preview = ["feature/*", "bugfix/*"]

# ============================================
# DEV SETTINGS
# ============================================
[dev]
  port = 3000
  publish = "."
  framework = "#static"
  targetPort = 3000
  autoLaunch = false
  [dev.command]
    develop = ""
    start = ""