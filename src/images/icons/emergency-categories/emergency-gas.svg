<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .cylinder {fill: #003366}
            .gas-top {fill: #f37021}
            .gas-flame {fill: #ff9900}
            .gas-handle {fill: #555555}
        </style>
    </defs>
    
    <!-- Gas Cylinder -->
    <ellipse cx="50" cy="40" rx="25" ry="15" class="cylinder"/>
    <rect x="25" y="40" width="50" height="40" rx="5" class="cylinder"/>
    <ellipse cx="50" cy="80" rx="25" ry="15" class="cylinder"/>
    
    <!-- Top Section -->
    <rect x="45" y="20" width="10" height="20" class="gas-top"/>
    <ellipse cx="50" cy="20" rx="15" ry="5" class="gas-top"/>
    
    <!-- Flame -->
    <path d="M50,15 Q45,5 40,10 Q45,0 50,5 Q55,0 60,10 Q55,5 50,15" class="gas-flame">
        <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
                 values="M50,15 Q45,5 40,10 Q45,0 50,5 Q55,0 60,10 Q55,5 50,15;
                         M50,15 Q45,8 40,12 Q45,3 50,8 Q55,3 60,12 Q55,8 50,15;
                         M50,15 Q45,5 40,10 Q45,0 50,5 Q55,0 60,10 Q55,5 50,15"/>
    </path>
    
    <!-- Handle -->
    <circle cx="50" cy="60" r="8" class="gas-handle"/>
    <circle cx="50" cy="60" r="4" fill="#ffffff"/>
</svg>