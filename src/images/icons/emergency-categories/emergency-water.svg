<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .water-drop {fill: #0099ff}
            .water-wave {fill: #003366}
            .faucet {fill: #555555}
            .faucet-handle {fill: #f37021}
        </style>
    </defs>
    
    <!-- Water Faucet -->
    <rect x="40" y="10" width="20" height="15" class="faucet"/>
    <rect x="45" y="25" width="10" height="20" class="faucet"/>
    <circle cx="50" cy="50" r="8" class="faucet"/>
    
    <!-- Faucet Handle -->
    <rect x="48" y="35" width="4" height="20" class="faucet-handle"/>
    <circle cx="50" cy="35" r="6" class="faucet-handle"/>
    
    <!-- Water Drop -->
    <path d="M50,55 Q45,70 50,85 Q55,70 50,55" class="water-drop">
        <animate attributeName="d" dur="2s" repeatCount="indefinite"
                 values="M50,55 Q45,70 50,85 Q55,70 50,55;
                         M50,60 Q45,75 50,90 Q55,75 50,60;
                         M50,55 Q45,70 50,85 Q55,70 50,55"/>
    </path>
    
    <!-- Water Waves -->
    <path d="M30,85 Q50,80 70,85 Q50,90 30,85" class="water-wave"/>
    <path d="M25,90 Q50,85 75,90 Q50,95 25,90" class="water-wave" opacity="0.6"/>
    
    <!-- Ripples -->
    <circle cx="50" cy="85" r="5" fill="none" stroke="#0099ff" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="5;15;5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>