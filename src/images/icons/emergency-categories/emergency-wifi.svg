<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .wifi-signal {fill: none; stroke: #0099ff; stroke-width: 4}
            .wifi-strong {stroke-opacity: 1}
            .wifi-medium {stroke-opacity: 0.6}
            .wifi-weak {stroke-opacity: 0.3}
            .router {fill: #003366}
            .router-light {fill: #28a745}
        </style>
    </defs>
    
    <!-- Router -->
    <rect x="30" y="60" width="40" height="20" rx="5" class="router"/>
    <rect x="35" y="65" width="30" height="10" fill="#ffffff" opacity="0.2"/>
    
    <!-- Antenna -->
    <rect x="48" y="40" width="4" height="20" class="router"/>
    
    <!-- WiFi Signals -->
    <circle cx="50" cy="40" r="30" class="wifi-signal wifi-weak"/>
    <circle cx="50" cy="40" r="20" class="wifi-signal wifi-medium"/>
    <circle cx="50" cy="40" r="10" class="wifi-signal wifi-strong"/>
    
    <!-- Signal Center -->
    <circle cx="50" cy="40" r="5" fill="#0099ff">
        <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Status Lights -->
    <circle cx="40" cy="70" r="2" class="router-light">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="70" r="2" class="router-light">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="60" cy="70" r="2" class="router-light">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
</svg>