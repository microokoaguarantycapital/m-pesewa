<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .group-person-1 {fill: #003366}
            .group-person-2 {fill: #0099ff}
            .group-person-3 {fill: #28a745}
            .group-person-4 {fill: #f37021}
            .group-circle {fill: none; stroke: #003366; stroke-width: 2; stroke-dasharray: 5,5}
            .group-connection {stroke: #0099ff; stroke-width: 2; fill: none}
        </style>
    </defs>
    
    <!-- Connecting Circle -->
    <circle cx="50" cy="50" r="40" class="group-circle"/>
    
    <!-- Person 1 (Top) -->
    <circle cx="50" cy="20" r="12" class="group-person-1"/>
    <line x1="50" y1="32" x2="50" y2="45" stroke="#003366" stroke-width="3"/>
    <line x1="50" y1="45" x2="40" y2="60" stroke="#003366" stroke-width="3"/>
    <line x1="50" y1="45" x2="60" y2="60" stroke="#003366" stroke-width="3"/>
    
    <!-- Person 2 (Right) -->
    <circle cx="80" cy="50" r="12" class="group-person-2"/>
    <line x1="80" y1="62" x2="80" y2="75" stroke="#0099ff" stroke-width="3"/>
    <line x1="80" y1="75" x2="70" y2="90" stroke="#0099ff" stroke-width="3"/>
    <line x1="80" y1="75" x2="90" y2="90" stroke="#0099ff" stroke-width="3"/>
    
    <!-- Person 3 (Bottom) -->
    <circle cx="50" cy="80" r="12" class="group-person-3"/>
    <line x1="50" y1="92" x2="50" y2="105" stroke="#28a745" stroke-width="3"/>
    <line x1="50" y1="105" x2="40" y2="120" stroke="#28a745" stroke-width="3"/>
    <line x1="50" y1="105" x2="60" y2="120" stroke="#28a745" stroke-width="3"/>
    
    <!-- Person 4 (Left) -->
    <circle cx="20" cy="50" r="12" class="group-person-4"/>
    <line x1="20" y1="62" x2="20" y2="75" stroke="#f37021" stroke-width="3"/>
    <line x1="20" y1="75" x2="10" y2="90" stroke="#f37021" stroke-width="3"/>
    <line x1="20" y1="75" x2="30" y2="90" stroke="#f37021" stroke-width="3"/>
    
    <!-- Connection Lines -->
    <path d="M50,20 Q65,35 80,50" class="group-connection"/>
    <path d="M80,50 Q65,65 50,80" class="group-connection"/>
    <path d="M50,80 Q35,65 20,50" class="group-connection"/>
    <path d="M20,50 Q35,35 50,20" class="group-connection"/>
    
    <!-- Trust Indicator -->
    <circle cx="50" cy="50" r="5" fill="#28a745">
        <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>