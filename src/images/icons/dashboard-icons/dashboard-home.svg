<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .dashboard-roof {fill: #f37021}
            .dashboard-house {fill: #003366}
            .dashboard-door {fill: #0099ff}
            .dashboard-window {fill: #f8f9fa}
            .dashboard-chart {fill: #28a745}
        </style>
    </defs>
    
    <!-- House -->
    <polygon points="50,20 20,50 80,50" class="dashboard-roof"/>
    <rect x="25" y="50" width="50" height="40" class="dashboard-house"/>
    
    <!-- Door -->
    <rect x="40" y="55" width="20" height="35" class="dashboard-door"/>
    <circle cx="55" cy="70" r="2" fill="#ffffff"/>
    
    <!-- Window -->
    <rect x="30" y="60" width="8" height="8" class="dashboard-window"/>
    
    <!-- Chart Bars -->
    <g transform="translate(60,60)">
        <!-- Bar 1 -->
        <rect x="0" y="15" width="5" height="10" class="dashboard-chart">
            <animate attributeName="height" values="10;20;10" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <!-- Bar 2 -->
        <rect x="7" y="10" width="5" height="15" class="dashboard-chart">
            <animate attributeName="height" values="15;25;15" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
        </rect>
        <!-- Bar 3 -->
        <rect x="14" y="5" width="5" height="20" class="dashboard-chart">
            <animate attributeName="height" values="20;30;20" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
        </rect>
    </g>
</svg>