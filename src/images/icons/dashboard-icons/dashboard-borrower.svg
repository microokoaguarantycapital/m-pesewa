<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .borrower-hand {fill: #f37021}
            .borrower-coin {fill: #ffcc00}
            .borrower-clock {fill: #003366}
            .borrower-due {fill: #0099ff}
        </style>
    </defs>
    
    <!-- Hand Receiving -->
    <path d="M30,60 Q40,40 50,50 Q60,40 70,60 L60,70 Q50,60 40,70 Z" class="borrower-hand"/>
    
    <!-- Coins -->
    <circle cx="40" cy="40" r="8" class="borrower-coin">
        <animate attributeName="cy" values="40;45;40" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="35" r="6" class="borrower-coin">
        <animate attributeName="cy" values="35;40;35" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="60" cy="40" r="8" class="borrower-coin">
        <animate attributeName="cy" values="40;45;40" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    
    <!-- Clock -->
    <circle cx="80" cy="80" r="15" class="borrower-clock"/>
    <circle cx="80" cy="80" r="13" fill="#ffffff"/>
    
    <!-- Clock Hands -->
    <!-- Hour Hand -->
    <line x1="80" y1="80" x2="80" y2="75" stroke="#003366" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="80" y1="80" x2="85" y2="80" stroke="#003366" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 80 80" to="360 80 80" dur="10s" repeatCount="indefinite"/>
    </line>
    
    <!-- Due Date -->
    <text x="80" y="80" text-anchor="middle" font-family="Arial" font-size="8" fill="#003366">7d</text>
</svg>