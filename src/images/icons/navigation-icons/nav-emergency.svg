<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .nav-cross {fill: #dc3545}
            .nav-circle {fill: #ffffff}
            .nav-flash {fill: #f37021}
        </style>
    </defs>
    
    <!-- Red Cross Circle -->
    <circle cx="50" cy="50" r="40" class="nav-cross"/>
    
    <!-- White Circle -->
    <circle cx="50" cy="50" r="30" class="nav-circle"/>
    
    <!-- Red Cross -->
    <rect x="48" y="30" width="4" height="40" class="nav-cross"/>
    <rect x="30" y="48" width="40" height="4" class="nav-cross"/>
    
    <!-- Lightning Bolt -->
    <path d="M45,40 L55,35 L50,50 L60,45 L55,60 L45,55 L50,40 Z" class="nav-flash">
        <animate attributeName="fill" values="#f37021;#ff9900;#f37021" dur="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- Pulsing Ring -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#dc3545" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="42;45;42" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
</svg>