<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .nav-briefcase {fill: #28a745}
            .nav-money {fill: #ffcc00}
            .nav-graph {fill: none; stroke: #003366; stroke-width: 3}
            .nav-graph-point {fill: #28a745}
        </style>
    </defs>
    
    <!-- Briefcase -->
    <rect x="30" y="40" width="40" height="30" rx="3" class="nav-briefcase"/>
    <rect x="35" y="35" width="30" height="5" class="nav-briefcase"/>
    
    <!-- Money Stack -->
    <rect x="45" y="45" width="10" height="20" fill="#ffcc00"/>
    <rect x="47" y="47" width="6" height="3" fill="#ffffff" opacity="0.5"/>
    <rect x="47" y="52" width="6" height="3" fill="#ffffff" opacity="0.5"/>
    <rect x="47" y="57" width="6" height="3" fill="#ffffff" opacity="0.5"/>
    
    <!-- Growth Graph -->
    <g transform="translate(20,20)">
        <path d="M0,30 L15,20 L30,25 L45,15 L60,10" class="nav-graph"/>
        
        <!-- Data Points -->
        <circle cx="0" cy="30" r="3" class="nav-graph-point"/>
        <circle cx="15" cy="20" r="3" class="nav-graph-point"/>
        <circle cx="30" cy="25" r="3" class="nav-graph-point"/>
        <circle cx="45" cy="15" r="3" class="nav-graph-point"/>
        <circle cx="60" cy="10" r="3" class="nav-graph-point"/>
    </g>
    
    <!-- Percentage Indicator -->
    <text x="80" y="30" font-family="Arial" font-size="10" font-weight="bold" fill="#28a745">↑</text>
</svg>