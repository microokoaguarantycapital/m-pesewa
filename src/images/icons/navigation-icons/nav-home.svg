<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .nav-roof {fill: #003366}
            .nav-house {fill: #0099ff}
            .nav-door {fill: #f37021}
            .nav-window {fill: #ffffff}
        </style>
    </defs>
    
    <!-- Roof -->
    <polygon points="50,20 20,50 80,50" class="nav-roof"/>
    
    <!-- House -->
    <rect x="25" y="50" width="50" height="40" class="nav-house"/>
    
    <!-- Door -->
    <rect x="40" y="60" width="20" height="30" class="nav-door"/>
    <circle cx="55" cy="75" r="2" fill="#ffffff"/>
    
    <!-- Window -->
    <rect x="30" y="60" width="8" height="8" class="nav-window"/>
    
    <!-- Welcome Mat -->
    <rect x="35" y="90" width="30" height="5" fill="#f37021"/>
</svg>