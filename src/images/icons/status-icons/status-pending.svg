<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .pending-circle {fill: #f37021}
            .pending-inner {fill: #ffffff}
            .pending-hand {stroke: #f37021; stroke-width: 4; fill: none}
        </style>
    </defs>
    
    <circle cx="50" cy="50" r="40" class="pending-circle"/>
    <circle cx="50" cy="50" r="30" class="pending-inner"/>
    
    <!-- Clock Hands -->
    <line x1="50" y1="50" x2="50" y2="30" class="pending-hand" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="65" y2="50" class="pending-hand" stroke-linecap="round">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 50 50" to="360 50 50" dur="8s" repeatCount="indefinite"/>
    </line>
    
    <!-- Pulsing Dot -->
    <circle cx="50" cy="50" r="8" class="pending-circle">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
</svg>