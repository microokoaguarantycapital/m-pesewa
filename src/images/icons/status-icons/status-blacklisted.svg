<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .blacklisted-circle {fill: #000000}
            .blacklisted-strike {stroke: #dc3545; stroke-width: 8}
            .blacklisted-lock {fill: #ffffff}
        </style>
    </defs>
    
    <circle cx="50" cy="50" r="40" class="blacklisted-circle"/>
    
    <!-- Strike Through -->
    <line x1="25" y1="25" x2="75" y2="75" class="blacklisted-strike"/>
    <line x1="75" y1="25" x2="25" y2="75" class="blacklisted-strike"/>
    
    <!-- Lock Symbol -->
    <rect x="40" y="55" width="20" height="15" rx="3" class="blacklisted-lock"/>
    <rect x="45" y="40" width="10" height="15" class="blacklisted-lock"/>
    <circle cx="50" cy="45" r="3" class="blacklisted-circle"/>
    
    <!-- Warning Glow -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#dc3545" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="45;50;45" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
</svg>