<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <defs>
        <style>
            .drc-blue {fill: #007FFF}
            .drc-yellow {fill: #F7D618}
            .drc-red {fill: #CE1021}
        </style>
    </defs>
    <rect width="900" height="600" class="drc-blue"/>
    <path d="M0,0 L900,600" stroke="#F7D618" stroke-width="60"/>
    <path d="M0,0 L900,600" stroke="#CE1021" stroke-width="30"/>
    <g transform="translate(150,300)">
        <circle cx="0" cy="0" r="40" class="drc-yellow"/>
        <path d="M-30,-50 L30,-50 L0,50 Z" class="drc-red"/>
    </g>
</svg>