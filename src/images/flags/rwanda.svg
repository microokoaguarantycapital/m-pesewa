<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
    <defs>
        <style>
            .rwanda-blue {fill: #20603D}
            .rwanda-yellow {fill: #FAD201}
            .rwanda-green {fill: #00A1DE}
            .rwanda-sun {fill: #E10019}
        </style>
    </defs>
    <rect width="900" height="360" y="0" class="rwanda-blue"/>
    <rect width="900" height="120" y="360" class="rwanda-yellow"/>
    <rect width="900" height="120" y="480" class="rwanda-green"/>
    <g transform="translate(720,180)">
        <circle cx="0" cy="0" r="50" class="rwanda-sun"/>
        <g transform="rotate(0)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(45)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(90)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(135)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(180)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(225)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(270)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
        <g transform="rotate(315)">
            <rect x="-2" y="-70" width="4" height="30" class="rwanda-sun"/>
        </g>
    </g>
</svg>