<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - M-Pesewa</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/colors.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/cards.css">
    <link rel="stylesheet" href="../../assets/css/tables.css">
    <link rel="stylesheet" href="../../assets/css/forms.css">
    <link rel="stylesheet" href="../../assets/css/badges.css">
    <link rel="stylesheet" href="../../assets/css/navigation.css">
    <link rel="stylesheet" href="../../assets/css/footer.css">
    <link rel="stylesheet" href="../../assets/css/flags.css">
    <style>
        .group-list-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 51, 102, 0.1);
        }
        
        .page-title h1 {
            color: #003366;
            margin: 0;
            font-size: 28px;
        }
        
        .page-title p {
            color: #555555;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        
        .create-group-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .create-group-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .group-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }
        
        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: #0099ff;
        }
        
        .group-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .group-name {
            font-size: 18px;
            font-weight: 600;
            color: #003366;
            margin: 0;
        }
        
        .group-type {
            background: #0099ff;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .group-body {
            padding: 20px;
        }
        
        .group-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .country-flag {
            font-size: 32px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        .group-details {
            flex: 1;
        }
        
        .group-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #003366;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .group-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .star {
            color: #ffc107;
            font-size: 16px;
        }
        
        .rating-value {
            font-weight: 600;
            color: #003366;
        }
        
        .group-footer {
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .group-state {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .state-active { background: #d4edda; color: #155724; }
        .state-locked { background: #fff3cd; color: #856404; }
        .state-suspended { background: #f8d7da; color: #721c24; }
        .state-created { background: #e2e3e5; color: #383d41; }
        .state-archived { background: #d1ecf1; color: #0c5460; }
        
        .view-group-btn {
            background: #003366;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .view-group-btn:hover {
            background: #002244;
            transform: translateY(-2px);
        }
        
        .no-groups {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 51, 102, 0.1);
        }
        
        .no-groups-icon {
            font-size: 48px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        
        .no-groups h3 {
            color: #003366;
            margin: 0 0 10px 0;
        }
        
        .no-groups p {
            color: #555555;
            margin: 0 0 20px 0;
        }
        
        .filters-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 10px rgba(0, 51, 102, 0.1);
        }
        
        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .filters-header h3 {
            color: #003366;
            margin: 0;
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .filter-group {
            margin-bottom: 10px;
        }
        
        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #003366;
            font-weight: 500;
            font-size: 14px;
        }
        
        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #0099ff;
            box-shadow: 0 0 0 0.2rem rgba(0, 153, 255, 0.25);
        }
        
        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .btn-apply {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn-reset {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn-apply:hover {
            background: #218838;
        }
        
        .btn-reset:hover {
            background: #5a6268;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 30px;
        }
        
        .page-btn {
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            background: white;
            color: #003366;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover {
            background: #f8f9fa;
            border-color: #0099ff;
        }
        
        .page-btn.active {
            background: #003366;
            color: white;
            border-color: #003366;
        }
        
        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .groups-grid {
                grid-template-columns: 1fr;
            }
            
            .page-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .filter-row {
                grid-template-columns: 1fr;
            }
        }
        
        .membership-badge {
            background: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        
        .admin-badge {
            background: #003366;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header will be injected by JavaScript -->
    <div id="header-placeholder"></div>

    <div class="group-list-container">
        <div class="page-header">
            <div class="page-title">
                <h1>Groups Directory</h1>
                <p>Browse and join trusted lending circles in your country</p>
            </div>
            <button class="create-group-btn" onclick="window.location.href='group-create.html'">
                <span>+</span> Create New Group
            </button>
        </div>

        <div class="filters-section">
            <div class="filters-header">
                <h3>Filter Groups</h3>
                <span id="total-groups">0 groups found</span>
            </div>
            
            <div class="filter-row">
                <div class="filter-group">
                    <label for="country-filter">Country</label>
                    <select id="country-filter" class="country-select">
                        <option value="">All Countries</option>
                        <!-- Countries will be populated by JavaScript -->
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="type-filter">Group Type</label>
                    <select id="type-filter">
                        <option value="">All Types</option>
                        <option value="FAMILY">Family</option>
                        <option value="CHURCH">Church</option>
                        <option value="PROFESSIONAL">Professional</option>
                        <option value="LOCAL_COMMUNITY">Local Community</option>
                        <option value="SOCIAL">Social</option>
                        <option value="BUSINESS_ASSOCIATION">Business Association</option>
                        <option value="STUDENT">Student</option>
                        <option value="NEIGHBORHOOD">Neighborhood</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="state-filter">Group State</label>
                    <select id="state-filter">
                        <option value="">All States</option>
                        <option value="ACTIVE">Active</option>
                        <option value="LOCKED">Locked</option>
                        <option value="CREATED">Created</option>
                    </select>
                </div>
            </div>
            
            <div class="filter-row">
                <div class="filter-group">
                    <label for="search-filter">Search Groups</label>
                    <input type="text" id="search-filter" placeholder="Search by group name or admin...">
                </div>
                
                <div class="filter-group">
                    <label for="members-filter">Min Members</label>
                    <input type="number" id="members-filter" min="0" max="1000" placeholder="Minimum members">
                </div>
                
                <div class="filter-group">
                    <label for="rating-filter">Min Rating</label>
                    <select id="rating-filter">
                        <option value="">Any Rating</option>
                        <option value="1">1+ Stars</option>
                        <option value="2">2+ Stars</option>
                        <option value="3">3+ Stars</option>
                        <option value="4">4+ Stars</option>
                        <option value="5">5 Stars</option>
                    </select>
                </div>
            </div>
            
            <div class="filter-actions">
                <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
                <button class="btn-apply" onclick="applyFilters()">Apply Filters</button>
            </div>
        </div>

        <div class="loading-spinner" id="loading-spinner">
            <div class="spinner"></div>
            <p>Loading groups...</p>
        </div>

        <div class="groups-grid" id="groups-container">
            <!-- Groups will be loaded here by JavaScript -->
        </div>

        <div class="pagination" id="pagination">
            <!-- Pagination will be generated by JavaScript -->
        </div>
    </div>

    <!-- Footer will be injected by JavaScript -->
    <div id="footer-placeholder"></div>

    <script src="../../core/app.js"></script>
    <script src="../../state/store.js"></script>
    <script src="../../groups/group.service.js"></script>
    <script src="../../groups/group.validation.js"></script>
    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!checkAuth()) {
                window.location.href = '../../auth/login.html';
                return;
            }
            
            // Check country selection
            if (!checkCountry()) {
                window.location.href = '../../global-pages/countries.html';
                return;
            }
            
            // Load header and footer
            loadHeader();
            loadFooter();
            
            // Initialize group service
            const groupService = new GroupService();
            const validation = new GroupValidation();
            
            // Load groups
            loadGroups();
            
            // Populate country filter
            populateCountryFilter();
        });
        
        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('mpesewa_user') || 'null');
            return user !== null;
        }
        
        function checkCountry() {
            const country = localStorage.getItem('mpesewa_country');
            return country !== null;
        }
        
        function loadHeader() {
            fetch('../../layout/Header.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('header-placeholder').innerHTML = html;
                    // Initialize header functionality
                    initializeHeader();
                })
                .catch(error => {
                    console.error('Error loading header:', error);
                    document.getElementById('header-placeholder').innerHTML = '<div style="padding: 20px; background: #003366; color: white;">M-PESEWA</div>';
                });
        }
        
        function loadFooter() {
            fetch('../../layout/Footer.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer-placeholder').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading footer:', error);
                    document.getElementById('footer-placeholder').innerHTML = '<div style="padding: 20px; background: #1f2a37; color: white; text-align: center;">© M-PESEWA 2024</div>';
                });
        }
        
        function initializeHeader() {
            // Add active class to current menu item
            const currentPage = window.location.pathname.split('/').pop();
            const menuItems = document.querySelectorAll('.nav-link');
            menuItems.forEach(item => {
                if (item.getAttribute('href')?.includes('groups')) {
                    item.classList.add('active');
                }
            });
        }
        
        let currentPage = 1;
        const groupsPerPage = 9;
        let allGroups = [];
        let filteredGroups = [];
        
        async function loadGroups() {
            const loadingSpinner = document.getElementById('loading-spinner');
            const groupsContainer = document.getElementById('groups-container');
            
            loadingSpinner.style.display = 'block';
            groupsContainer.innerHTML = '';
            
            try {
                // Simulate API call delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const groupService = new GroupService();
                const groups = groupService.getGroupsForCurrentCountry();
                
                // Filter out suspended and archived groups from main listing
                allGroups = groups.filter(group => 
                    group.state !== 'SUSPENDED' && 
                    group.state !== 'ARCHIVED'
                );
                
                // Apply initial filters
                filteredGroups = applyCurrentFilters(allGroups);
                
                // Update total count
                document.getElementById('total-groups').textContent = 
                    `${filteredGroups.length} groups found`;
                
                // Display groups for current page
                displayGroupsForPage(currentPage);
                
                // Update pagination
                updatePagination();
                
            } catch (error) {
                console.error('Error loading groups:', error);
                groupsContainer.innerHTML = `
                    <div class="no-groups">
                        <div class="no-groups-icon">⚠️</div>
                        <h3>Error Loading Groups</h3>
                        <p>There was a problem loading groups. Please try again.</p>
                        <button class="view-group-btn" onclick="loadGroups()">Retry</button>
                    </div>
                `;
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }
        
        function applyCurrentFilters(groups) {
            const countryFilter = document.getElementById('country-filter').value;
            const typeFilter = document.getElementById('type-filter').value;
            const stateFilter = document.getElementById('state-filter').value;
            const searchFilter = document.getElementById('search-filter').value.toLowerCase();
            const membersFilter = parseInt(document.getElementById('members-filter').value) || 0;
            const ratingFilter = parseFloat(document.getElementById('rating-filter').value) || 0;
            
            return groups.filter(group => {
                // Country filter
                if (countryFilter && group.country !== countryFilter) return false;
                
                // Type filter
                if (typeFilter && group.type !== typeFilter) return false;
                
                // State filter
                if (stateFilter && group.state !== stateFilter) return false;
                
                // Members filter
                if (membersFilter > 0 && group.memberCount < membersFilter) return false;
                
                // Rating filter
                if (ratingFilter > 0 && group.groupRating < ratingFilter) return false;
                
                // Search filter
                if (searchFilter) {
                    const searchText = searchFilter.toLowerCase();
                    const groupName = group.name.toLowerCase();
                    const adminName = group.adminUsername.toLowerCase();
                    const groupNickname = (group.nickname || '').toLowerCase();
                    
                    if (!groupName.includes(searchText) && 
                        !adminName.includes(searchText) && 
                        !groupNickname.includes(searchText)) {
                        return false;
                    }
                }
                
                return true;
            });
        }
        
        function applyFilters() {
            currentPage = 1;
            filteredGroups = applyCurrentFilters(allGroups);
            document.getElementById('total-groups').textContent = 
                `${filteredGroups.length} groups found`;
            displayGroupsForPage(currentPage);
            updatePagination();
        }
        
        function resetFilters() {
            document.getElementById('country-filter').value = '';
            document.getElementById('type-filter').value = '';
            document.getElementById('state-filter').value = '';
            document.getElementById('search-filter').value = '';
            document.getElementById('members-filter').value = '';
            document.getElementById('rating-filter').value = '';
            applyFilters();
        }
        
        function displayGroupsForPage(page) {
            const groupsContainer = document.getElementById('groups-container');
            
            if (filteredGroups.length === 0) {
                groupsContainer.innerHTML = `
                    <div class="no-groups">
                        <div class="no-groups-icon">👥</div>
                        <h3>No Groups Found</h3>
                        <p>No groups match your filters. Try adjusting your search criteria or create a new group.</p>
                        <button class="view-group-btn" onclick="resetFilters()">Reset Filters</button>
                    </div>
                `;
                return;
            }
            
            const startIndex = (page - 1) * groupsPerPage;
            const endIndex = startIndex + groupsPerPage;
            const pageGroups = filteredGroups.slice(startIndex, endIndex);
            
            let groupsHTML = '';
            
            pageGroups.forEach(group => {
                const currentUser = JSON.parse(localStorage.getItem('mpesewa_user') || '{}');
                const isMember = group.members.some(m => m.userId === currentUser.id);
                const isAdmin = isMember && group.members.find(m => m.userId === currentUser.id)?.role === 'ADMIN';
                
                groupsHTML += `
                    <div class="group-card">
                        <div class="group-header">
                            <h3 class="group-name">${escapeHtml(group.name)}</h3>
                            <span class="group-type">${group.type}</span>
                        </div>
                        
                        <div class="group-body">
                            <div class="group-info">
                                <div class="country-flag">
                                    ${getCountryFlag(group.country)}
                                </div>
                                <div class="group-details">
                                    <div style="margin-bottom: 10px;">
                                        ${isMember ? 
                                            isAdmin ? 
                                                '<span class="admin-badge">Admin</span>' : 
                                                '<span class="membership-badge">Member</span>' : 
                                            '<span style="color: #6c757d; font-size: 12px;">Not a member</span>'
                                        }
                                    </div>
                                    <p style="color: #555; margin: 0; font-size: 14px;">
                                        <strong>Admin:</strong> ${escapeHtml(group.adminUsername)}
                                    </p>
                                    <p style="color: #555; margin: 5px 0 0 0; font-size: 14px;">
                                        <strong>Created:</strong> ${formatDate(group.createdAt)}
                                    </p>
                                </div>
                            </div>
                            
                            <div class="group-stats">
                                <div class="stat-item">
                                    <span class="stat-value">${group.memberCount}</span>
                                    <span class="stat-label">Members</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${group.lenderCount}</span>
                                    <span class="stat-label">Lenders</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${group.borrowerCount}</span>
                                    <span class="stat-label">Borrowers</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${group.currency} ${formatCurrency(group.totalAmountLent)}</span>
                                    <span class="stat-label">Total Lent</span>
                                </div>
                            </div>
                            
                            <div class="group-rating">
                                ${generateStarRating(group.groupRating)}
                                <span class="rating-value">${group.groupRating.toFixed(1)}</span>
                                <span style="color: #6c757d; font-size: 12px; margin-left: auto;">
                                    ${group.successfulRepaymentRate}% Repayment Rate
                                </span>
                            </div>
                        </div>
                        
                        <div class="group-footer">
                            <span class="group-state state-${group.state.toLowerCase()}">
                                ${group.state}
                            </span>
                            <button class="view-group-btn" onclick="viewGroup('${group.id}')">
                                ${isMember ? 'View Group' : 'View Details'}
                            </button>
                        </div>
                    </div>
                `;
            });
            
            groupsContainer.innerHTML = groupsHTML;
        }
        
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredGroups.length / groupsPerPage);
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
                        onclick="changePage(${currentPage - 1})" 
                        ${currentPage === 1 ? 'disabled' : ''}>
                    ← Previous
                </button>
            `;
            
            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" 
                            onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }
            
            // Next button
            paginationHTML += `
                <button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
                        onclick="changePage(${currentPage + 1})" 
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    Next →
                </button>
            `;
            
            pagination.innerHTML = paginationHTML;
        }
        
        function changePage(page) {
            if (page < 1 || page > Math.ceil(filteredGroups.length / groupsPerPage)) return;
            currentPage = page;
            displayGroupsForPage(currentPage);
            updatePagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function viewGroup(groupId) {
            // Check if user is member of this group
            const groupService = new GroupService();
            const group = groupService.getGroup(groupId);
            const currentUser = JSON.parse(localStorage.getItem('mpesewa_user') || '{}');
            
            if (!group) {
                alert('Group not found');
                return;
            }
            
            const isMember = group.members.some(m => m.userId === currentUser.id);
            
            if (isMember) {
                // Redirect to group dashboard
                window.location.href = `group-dashboard.html?groupId=${groupId}`;
            } else {
                // Redirect to group details page or join page
                window.location.href = `group-details.html?groupId=${groupId}`;
            }
        }
        
        function populateCountryFilter() {
            const countrySelect = document.getElementById('country-filter');
            const countries = [
                'Kenya', 'Uganda', 'Tanzania', 'Rwanda', 'Burundi',
                'DRC', 'South Sudan', 'South Africa', 'Nigeria', 'Ghana', 'Ethiopia'
            ];
            
            // Get current user's country
            const currentCountry = localStorage.getItem('mpesewa_country');
            
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                if (country === currentCountry) {
                    option.selected = true;
                }
                countrySelect.appendChild(option);
            });
        }
        
        function getCountryFlag(country) {
            const flags = {
                'Kenya': '🇰🇪',
                'Uganda': '🇺🇬',
                'Tanzania': '🇹🇿',
                'Rwanda': '🇷🇼',
                'Burundi': '🇧🇮',
                'DRC': '🇨🇩',
                'South Sudan': '🇸🇸',
                'South Africa': '🇿🇦',
                'Nigeria': '🇳🇬',
                'Ghana': '🇬🇭',
                'Ethiopia': '🇪🇹'
            };
            return flags[country] || '🇺🇳';
        }
        
        function generateStarRating(rating) {
            let stars = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) {
                    stars += '<span class="star">★</span>';
                } else if (i === fullStars + 1 && hasHalfStar) {
                    stars += '<span class="star">⭐</span>';
                } else {
                    stars += '<span class="star" style="color: #dee2e6;">★</span>';
                }
            }
            
            return stars;
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }
        
        function formatCurrency(amount) {
            return amount.toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
